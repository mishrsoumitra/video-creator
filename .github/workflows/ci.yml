name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit and web tests (with coverage)
        run: npm run test:coverage
      - name: ffmpeg integration tests
        run: npm run test:media
      - name: Remotion render tests
        run: npx remotion browser ensure && npm run test:render
      - run: npm run build
